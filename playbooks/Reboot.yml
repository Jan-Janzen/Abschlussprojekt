---
- name: Neustart aller Server
  hosts: ubuntu
  become user: administrator
  become: yes
  
  tasks:
    - name: Server neustarten
      ansible.builtin.reboot:
        reboot_timeout: 1800
        msg: "Auto Reboot durch Ansible Semaphore"

    - name: Warten bis System wieder online
      ansible.builtin.wait_for_connection:
        timeout: 300
