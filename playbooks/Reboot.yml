---
- name: Reboot all servers
  hosts: all
  become: yes
  
  tasks:
    - name: reboot servers
      ansible.builtin.reboot:
        reboot_timeout: 1800
        msg: "Automatic reboot via Ansible Semaphore"

    - name: Waiting for system restart
      ansible.builtin.wait_for_connection:
        timeout: 300