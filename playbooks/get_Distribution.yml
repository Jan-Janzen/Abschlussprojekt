---
- name: Get distribution and update status
  hosts: all
  gather_facts: yes

  tasks:
    - name: Get distribution and version
      debug:
        msg: "Host {{ inventory_hostname }} runs on {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Get installed software
      when: ansible_os_family == "Debian"
      shell: apt list --installed
      register: apt_installed
      changed_when: false
      failed_when: false

    - name: Check for available updates on Debian/Ubuntu
      when: ansible_os_family == "Debian"
      shell: apt list --upgradable
      register: apt_updates
      changed_when: false
      failed_when: false

    - name: Check for available updates on RHEL/CentOS/Fedora
      when: ansible_os_family == "RedHat"
      shell: yum check-update
      register: yum_updates
      failed_when: false
      changed_when: false

    - name: Show installed packages
      debug:
        var: apt_installed.stdout_lines
    
#    - name: Show available Updates
#      debug:
#        var: apt_updates.stdout_lines
    
    - name: Output available updates Debian/Ubuntu
      when: ansible_os_family == "Debian"
      debug:
        msg: >-
          {%set installed = apt_installed.stdout_lines | default ([]) %}
          {% set upgradable_packages = [] %}
          {% for line in apt_updates.stdout_lines | default([]) %}
            {% set pkg = line.split('/')[0] %}
            {% if pkg in installed %}
              {% set _ = upgradable_packages.append(line) %}
            {% endif %}
          {% endfor %}
          {% if upgradable_packages | length == 0 %}
            No available updates on {{ inventory_hostname }}.
          {% else %}
            updates available on {{inventory_hostname}}:
            {{ upgradable_packages | join('\n')}}
          {% endif %}

#          {% set updates = apt_updates.stdout_lines | default([]) | select(
#            'regex_search',
#            '^(' + installed | join('|') + ')/'
#          ) | list %}

    - name: Output update status RHEL/CentOS/Fedora
      when: ansible_os_family == "RedHat"
      debug:
        msg: >-
          {% if yum_updates.stdout_lines | length == 0 %}
            No available updates on {{ inventory_hostname }}.
          {% else %}
            Updates available on {{ inventory_hostname }}:
            {{ yum_updates.stdout }}
          {% endif %}
